  <!--
    Google Consent Mode v2 bootstrap.
    Runs synchronously BEFORE the GTM loader so the container sees a valid
    default (and, for returning visitors, the restored choice) from tick zero.
    Single source of truth for stored consent: localStorage['bread_consent_state'].
  -->
  <script>
    (function () {
      window.dataLayer = window.dataLayer || [];
      function gtag(){ window.dataLayer.push(arguments); }
      window.gtag = window.gtag || gtag;

      // 1) Legal baseline — required by CMv2. A default MUST exist before any update.
      //    ad/analytics = denied; functionality/security = granted (strictly necessary).
      gtag('consent', 'default', {
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        analytics_storage: 'denied',
        functionality_storage: 'granted',
        security_storage: 'granted',
        wait_for_update: 500
      });
      window.__consentDefaultSet = true;

      // 2) Returning visitor: restore stored choice on the SAME synchronous tick,
      //    so no tag ever observes the transient "all denied" state. The default
      //    above is the baseline; this update is non-destructive because it fires
      //    before GTM boots and before any tag reads consent.
      try {
        var raw = window.localStorage.getItem('bread_consent_state');
        if (raw) {
          var saved = JSON.parse(raw);
          if (saved && typeof saved === 'object') {
            gtag('consent', 'update', {
              ad_storage: saved.ad_storage || 'denied',
              ad_user_data: saved.ad_user_data || 'denied',
              ad_personalization: saved.ad_personalization || 'denied',
              analytics_storage: saved.analytics_storage || 'denied',
              functionality_storage: saved.functionality_storage || 'granted',
              security_storage: saved.security_storage || 'granted'
            });
            window.__consentInitialUpdatePushed = true;
          }
        }
      } catch (e) { /* storage unavailable — banner will handle it at runtime */ }
    })();
  </script>
