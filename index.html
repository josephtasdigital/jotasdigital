  <script>
    // Google Consent Mode v2 bootstrap. Runs synchronously BEFORE GTM loads.
    // 1) Set default: everything denied except strictly-necessary. This is the
    //    legal baseline required by CMv2.
    // 2) If the visitor already made a choice (stored in localStorage), replay
    //    it as `consent update` on the same tick — so returning visitors are
    //    never briefly downgraded to all-denied. Saved choice is NEVER
    //    overwritten by the default.
    // Single source of truth: localStorage['bread_consent_state'].

      window.dataLayer = window.dataLayer || [];
      function gtag(){ window.dataLayer.push(arguments); }
      window.gtag = window.gtag || gtag;

      gtag('consent', 'default', {

        ad_user_data: 'denied',

        analytics_storage: 'denied',
        functionality_storage: 'granted',
        security_storage: 'granted',
        wait_for_update: 500
      });
      window.__consentDefaultSet = true;

      try {
        var raw = window.localStorage.getItem('bread_consent_state');
        if (raw) {
          var saved = JSON.parse(raw) || {};
          gtag('consent', 'update', {
            ad_storage: saved.ad_storage === 'granted' ? 'granted' : 'denied',
            ad_user_data: saved.ad_user_data === 'granted' ? 'granted' : 'denied',
            ad_personalization: saved.ad_personalization === 'granted' ? 'granted' : 'denied',
            analytics_storage: saved.analytics_storage === 'granted' ? 'granted' : 'denied',
            functionality_storage: 'granted',
            security_storage: 'granted'
          });
        }
      } catch (e) { /* storage unavailable — banner will handle it at runtime */ }
    })();
  </script>
